<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>さく研究所 | SAKU KENKYUJO COLLECTION</title>
  <style>
    /* -------------------------------------
       ベース設定
    ------------------------------------- */
    :root {
      --bg-color: #000;
      --text-color: #fff;
      --font-main: "Helvetica Neue", "Arial", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif;
    }

    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: var(--bg-color);
      font-family: var(--font-main);
      overflow: hidden; /* 全体のスクロールバーを隠す */
    }

    /* -------------------------------------
       UIパーツ（ロゴ・ナビゲーション）
       ※mix-blend-modeで背景色に合わせて自動反転
    ------------------------------------- */
    .header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 30px 40px;
      box-sizing: border-box;
      z-index: 100;
      pointer-events: none; /* 下の画像へのクリックを邪魔しない */
      mix-blend-mode: difference;
      color: var(--text-color);
    }

    .logo {
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 0.3em;
      margin: 0;
    }

    /* 右上のMakeShopリンク */
    .nav a {
      pointer-events: auto; /* リンクはクリック可能に */
      color: var(--text-color);
      text-decoration: none;
      font-size: 11px;
      letter-spacing: 0.15em;
      position: relative;
      padding-bottom: 4px;
      transition: opacity 0.3s ease;
    }

    .nav a::after {
      content: '';
      position: absolute;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 1px;
      background-color: currentColor;
      transform: scaleX(0);
      transform-origin: right;
      transition: transform 0.4s cubic-bezier(0.19, 1, 0.22, 1);
    }

    .nav a:hover::after {
      transform: scaleX(1);
      transform-origin: left;
    }

    /* -------------------------------------
       スクロール設定（スナップ機能）
    ------------------------------------- */
    .scroll-container {
      width: 100%;
      height: 100vh;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scroll-behavior: smooth;
      -ms-overflow-style: none; 
      scrollbar-width: none;    
    }
    .scroll-container::-webkit-scrollbar {
      display: none; 
    }

    /* 各セクション */
    .page {
      width: 100%;
      height: 100vh;
      scroll-snap-align: start;
      position: relative;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: var(--bg-color);
    }

    /* -------------------------------------
       画像とアニメーション設定
    ------------------------------------- */
    .page img {
      width: 100%;
      height: 100%;
      object-fit: cover; /* 画面いっぱいに美しくトリミング */
      opacity: 0;
      transform: scale(1.05); /* 初期状態は少し拡大 */
      transition: opacity 1.5s cubic-bezier(0.25, 1, 0.5, 1), 
                  transform 2s cubic-bezier(0.25, 1, 0.5, 1);
    }

    /* スクロールで画面内に入った時のクラス */
    .page.is-visible img {
      opacity: 1;
      transform: scale(1); /* 等倍にゆっくり戻る高級感のある動き */
    }

    /* -------------------------------------
       下部のMakeShopリンク（各画像用）
    ------------------------------------- */
    .shop-link-bottom {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      color: var(--text-color);
      text-decoration: none;
      font-size: 11px;
      letter-spacing: 0.2em;
      mix-blend-mode: difference;
      opacity: 0.8;
      transition: opacity 0.3s ease, letter-spacing 0.3s ease;
      z-index: 10;
    }

    .shop-link-bottom:hover {
      opacity: 1;
      letter-spacing: 0.3em;
    }

    /* スマホ表示用の微調整 */
    @media (max-width: 768px) {
      .header {
        padding: 20px;
        flex-direction: column;
        align-items: flex-start;
        gap: 15px;
      }
    }
  </style>
</head>
<body>

  <!-- 追従するヘッダー -->
  <header class="header">
    <h1 class="logo">SAKU KENKYUJO</h1>
    <nav class="nav">
      <!-- 画面右上の固定リンク -->
      <a href="https://www.makeshop.jp/" class="global-shop-url" target="_blank">ONLINE STORE</a>
    </nav>
  </header>

  <!-- 写真が展開されるエリア -->
  <div class="scroll-container" id="gallery">
    <!-- JavaScriptで自動生成されます -->
  </div>

  <script>
    // ==========================================
    // カスタマイズ設定
    // ==========================================
    const totalImages = 15; // 表示する枚数（15枚準備済み）
    const shopUrl = "https://www.makeshop.jp/"; // さく研究所のMakeShopのURLに変更してください
    // ==========================================

    // 右上のリンク先のURLを一括設定
    document.querySelector('.global-shop-url').href = shopUrl;

    const gallery = document.getElementById('gallery');

    // 1. 画像セクションの生成
    for (let i = 1; i <= totalImages; i++) {
      const fileName = `saku_${i}.jpg`; 

      const section = document.createElement('div');
      section.className = 'page';

      const img = document.createElement('img');
      img.src = fileName;
      img.alt = `SAKU KENKYUJO COLLECTION ${i}`;
      // 画面に見えるまで画像の読み込みを遅らせてサイトを軽くする
      img.loading = "lazy"; 

      const link = document.createElement('a');
      link.href = shopUrl;
      link.className = 'shop-link-bottom';
      link.textContent = 'DISCOVER MORE'; 
      link.target = "_blank"; 

      section.appendChild(img);
      section.appendChild(link);
      gallery.appendChild(section);
    }

    // 2. スクロールに合わせた極上のアニメーション（Intersection Observer）
    // 画面の50%に入ったら「is-visible」クラスを付けてアニメーション発火
    const observerOptions = {
      root: document.querySelector('.scroll-container'),
      rootMargin: '0px',
      threshold: 0.5 
    };

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('is-visible');
        } else {
          // 画面から外れたらクラスを外す（再度スクロールした時にアニメーションさせるため）
          entry.target.classList.remove('is-visible');
        }
      });
    }, observerOptions);

    // 全ての.page要素を監視対象にする
    document.querySelectorAll('.page').forEach(page => {
      observer.observe(page);
    });
  </script>
</body>
</html>
