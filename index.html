<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>サク KYOTO | LOOKBOOK</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Shippori+Mincho:wght@400;500;600&display=swap" rel="stylesheet">
  
  <style>
    /* ------------------------------------------
       ベースリセット・共通設定
    ------------------------------------------ */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html.lenis { height: auto; }
    .lenis.lenis-smooth { scroll-behavior: auto; }
    .lenis.lenis-smooth [data-lenis-prevent] { overscroll-behavior: contain; }
    .lenis.lenis-stopped { overflow: hidden; }
    .lenis.lenis-scrolling iframe { pointer-events: none; }

    body {
      background-color: #faf9f5;
      color: #2b2b2b;
      font-family: 'Shippori Mincho', "Yu Mincho", "Hiragino Mincho ProN", serif;
      line-height: 1.8;
      letter-spacing: 0.05em;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    a { color: inherit; text-decoration: none; }
    img { max-width: 100%; height: auto; display: block; }

    /* ------------------------------------------
       ローディング画面（シネマティック演出）
    ------------------------------------------ */
    #preloader {
      position: fixed;
      inset: 0;
      background: #faf9f5;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 1.2s cubic-bezier(0.7, 0, 0.3, 1), visibility 1.2s ease;
    }
    #preloader .loader-logo {
      font-family: 'Cormorant Garamond', 'Shippori Mincho', serif;
      font-size: 22px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      opacity: 0;
      animation: pulseLogo 2s infinite ease-in-out;
    }
    @keyframes pulseLogo {
      0% { opacity: 0.3; transform: scale(0.98); }
      50% { opacity: 1; transform: scale(1); }
      100% { opacity: 0.3; transform: scale(0.98); }
    }
    .loaded #preloader { opacity: 0; visibility: hidden; }

    /* ------------------------------------------
       ヘッダー（すりガラス・追従）
    ------------------------------------------ */
    .site-header {
      position: fixed;
      top: 0;
      width: 100%;
      padding: 30px 20px;
      text-align: center;
      background: rgba(250, 249, 245, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      z-index: 100;
      transition: padding 0.5s ease, border-bottom 0.5s ease;
      border-bottom: 1px solid transparent;
    }
    .scrolled .site-header {
      padding: 15px 20px;
      border-bottom: 1px solid rgba(0,0,0,0.05);
    }
    .brand-logo {
      font-family: 'Cormorant Garamond', 'Shippori Mincho', serif;
      font-size: 24px;
      letter-spacing: 0.25em;
      font-weight: 500;
      text-transform: uppercase;
    }

    /* ------------------------------------------
       スクロール表示アニメーション（ふわっと浮かび上がる）
    ------------------------------------------ */
    .fade-up {
      opacity: 0;
      transform: translateY(50px);
      transition: opacity 1.2s cubic-bezier(0.19, 1, 0.22, 1), transform 1.2s cubic-bezier(0.19, 1, 0.22, 1);
    }
    .fade-up.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* ------------------------------------------
       コンセプトセクション
    ------------------------------------------ */
    .concept-section {
      padding: 180px 24px 100px; /* ヘッダー固定分の余白確保 */
      text-align: center;
      max-width: 780px;
      margin: 0 auto;
    }
    .concept-title {
      font-size: 32px;
      font-weight: 500;
      letter-spacing: 0.2em;
      margin-bottom: 24px;
    }
    .concept-lead {
      font-size: 14px;
      color: #777;
      margin-bottom: 48px;
      letter-spacing: 0.1em;
    }
    .concept-ja {
      font-size: 16px;
      line-height: 2.4;
      margin-bottom: 40px;
      letter-spacing: 0.1em;
      color: #111;
    }
    .concept-en {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 17px;
      color: #666;
      font-style: italic;
      line-height: 2;
      letter-spacing: 0.05em;
    }

    /* ------------------------------------------
       ルックブック（メイソンリーギャラリー）
    ------------------------------------------ */
    .lookbook-section {
      padding: 0 32px 120px;
      max-width: 1400px;
      margin: 0 auto;
    }
    .masonry-gallery {
      column-count: 3;
      column-gap: 40px;
    }
    @media (max-width: 1024px) {
      .masonry-gallery { column-count: 2; column-gap: 32px; }
      .lookbook-section { padding: 0 24px 90px; }
    }
    @media (max-width: 640px) {
      .masonry-gallery { column-count: 2; column-gap: 16px; }
      .lookbook-section { padding: 0 16px 60px; }
    }
    .look-card {
      break-inside: avoid;
      margin-bottom: 40px;
      display: block;
      cursor: crosshair; /* エディトリアル感を出すカスタムカーソル */
    }
    @media (max-width: 640px) { .look-card { margin-bottom: 24px; } }
    
    .look-image-wrap {
      width: 100%;
      overflow: hidden;
      background-color: #eee;
    }
    .look-image-wrap img {
      width: 100%;
      height: auto;
      /* プレミアムなホバーアニメーション設定 */
      transition: transform 1.5s cubic-bezier(0.19, 1, 0.22, 1), filter 1s ease;
      transform: scale(1.01);
    }
    .look-card:hover .look-image-wrap img {
      transform: scale(1.05);
      filter: brightness(0.9); /* 少し暗くしてリッチ感を出す */
    }
    .look-meta {
      padding-top: 16px;
      text-align: center;
    }
    .look-number {
      display: block;
      font-family: 'Cormorant Garamond', sans-serif;
      font-size: 13px;
      letter-spacing: 0.2em;
      color: #666;
    }

    /* ------------------------------------------
       店舗情報 & リンク
    ------------------------------------------ */
    .info-section {
      background-color: #f0eee9;
      padding: 100px 24px;
      border-top: 1px solid #e7e4dc;
    }
    .info-container { max-width: 960px; margin: 0 auto; }
    .section-title {
      font-size: 22px;
      font-weight: 500;
      text-align: center;
      letter-spacing: 0.2em;
      margin-bottom: 50px;
    }
    .shop-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      margin-bottom: 80px;
    }
    @media (max-width: 768px) { .shop-grid { grid-template-columns: 1fr; gap: 24px; margin-bottom: 50px;} }
    
    .shop-card {
      background: #faf9f5;
      padding: 40px;
      transition: transform 0.6s cubic-bezier(0.19, 1, 0.22, 1);
    }
    .shop-card:hover { transform: translateY(-5px); }
    .shop-name {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.1em;
      border-bottom: 1px solid #d4d1c9;
      padding-bottom: 12px;
      margin-bottom: 24px;
    }
    .shop-details dt {
      font-size: 11px;
      font-weight: 600;
      color: #888;
      margin-top: 16px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .shop-details dd {
      font-size: 14px;
      margin: 0;
      color: #333;
      line-height: 1.8;
    }
    .shop-details .note {
      display: block;
      font-size: 12px;
      color: #888;
      margin-top: 6px;
      line-height: 1.6;
    }

    .links-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; text-align: center; }
