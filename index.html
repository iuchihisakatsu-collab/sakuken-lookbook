<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SAKU KYOTO | 2027 COLLECTION</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Inter:wght@300;400&family=Shippori+Mincho:wght@400;500&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fancyapps/ui@5.0/dist/fancybox/fancybox.css" />

  <style>
    :root {
      --bg-color: #fcfcfc;
      --text-main: #111111;
      --text-muted: #888888;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html.lenis { height: auto; }
    .lenis.lenis-smooth { scroll-behavior: auto; }
    .lenis.lenis-smooth [data-lenis-prevent] { overscroll-behavior: contain; }
    .lenis.lenis-stopped { overflow: hidden; }

    html, body {
      width: 100%;
      position: relative;
      overflow-x: hidden;
    }
    main {
      width: 100%;
      overflow: hidden;
    }

    body {
      background-color: var(--bg-color); 
      color: var(--text-main);
      font-family: 'Inter', 'Shippori Mincho', "Hiragino Mincho ProN", serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      cursor: auto;
    }
    a { color: inherit; text-decoration: none; }
    img { max-width: 100%; height: auto; display: block; }

    /* --- ローディング（ロゴを300pxに拡大して主役に） --- */
    #preloader {
      position: fixed; inset: 0; background: var(--bg-color); z-index: 9999;
      display: flex; align-items: center; justify-content: center;
      transition: opacity 1.4s cubic-bezier(0.8, 0, 0.1, 1), visibility 1.4s ease;
    }
    .loader-logo {
      width: 80vw;
      max-width: 300px;
      mix-blend-mode: multiply;
      opacity: 0;
      transform: translateY(15px);
      animation: loaderFade 2s cubic-bezier(0.2, 1, 0.2, 1) forwards;
    }
    @keyframes loaderFade { 0% { opacity: 0; transform: translateY(15px); } 100% { opacity: 1; transform: translateY(0); } }
    .loaded #preloader { opacity: 0; visibility: hidden; }

    /* --- ヘッダー（初期サイズを58pxに拡大） --- */
    .site-header {
      position: fixed; top: 0; width: 100%; padding: 36px 40px;
      display: flex; justify-content: center; background: transparent;
      z-index: 200; transition: padding 0.5s ease, background 0.5s ease;
    }
    .scrolled .site-header {
      padding: 16px 40px; background: rgba(252, 252, 252, 0.92);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.02);
    }
    .header-logo-img {
      max-height: 58px;
      width: auto;
      mix-blend-mode: multiply;
      transition: max-height 0.5s cubic-bezier(0.2, 1, 0.2, 1);
    }
    .scrolled .header-logo-img {
      max-height: 28px;
    }

    /* --- インタラクティブ・ファーストビュー --- */
    .hero-interactive-section {
      width: 100%; height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      position: relative; padding-top: 80px;
    }
    .hero-slider-container {
      width: 90%; max-width: 700px; height: 74vh;
      position: relative; overflow: hidden;
      cursor: none; 
    }
    .hero-slide {
      position: absolute; inset: -20px;
      opacity: 0; visibility: hidden;
      transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1), transform 0.4s ease-out;
    }
    .hero-slide.is-active {
      opacity: 1; visibility: visible;
    }
    .hero-slide img {
      width: 100%; height: 100%; object-fit: cover;
      transform: scale(1.05); transition: transform 6s linear;
    }
    .hero-slide.is-active img { transform: scale(1); }
    
    .hero-meta {
      margin-top: 24px; font-family: 'Inter', sans-serif; font-size: 10px;
      letter-spacing: 0.4em; color: var(--text-main); text-transform: uppercase;
      opacity: 0; transform: translateY(10px);
    }
    .loaded .hero-meta {
      animation: fadeUpMeta 1s ease forwards; animation-delay: 0.8s;
    }
    @keyframes fadeUpMeta { to { opacity: 1; transform: translateY(0); } }

    /* --- カスタムカーソル（NEXT） --- */
    #custom-cursor {
      position: fixed; top: 0; left: 0;
      width: 70px; height: 70px; border-radius: 50%;
      background: var(--text-main); color: var(--bg-color);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Inter', sans-serif; font-size: 10px; letter-spacing: 0.1em;
      pointer-events: none; z-index: 9999;
      opacity: 0; transform: translate(-50%, -50%) scale(0.5);
      transition: opacity 0.3s ease, transform 0.1s linear;
    }
    @media (max-width: 768px) { #custom-cursor { display: none !important; } .hero-slider-container { cursor: pointer; } }

    /* --- ステートメント --- */
    .statement-section { padding: 180px 24px; text-align: center; max-width: 700px; margin: 0 auto; }
    .fade-up { opacity: 0; transform: translateY(40px); transition: all 1.4s cubic-bezier(0.2, 1, 0.2, 1); }
    .fade-up.is-visible { opacity: 1; transform: translateY(0); }
    .statement-ja { font-size: 15px; line-height: 2.8; margin-bottom: 50px; letter-spacing: 0.2em; color: var(--text-main); }
    .statement-en { font-family: 'Cormorant Garamond', serif; font-size: 18px; color: var(--text-muted); font-style: italic; line-height: 2; letter-spacing: 0.05em; }

    /* --- コレクション --- */
    .collections-wrap { padding-bottom: 180px; }
    .collection-row { margin-bottom: 160px; }
    .collection-heading { padding: 0 5vw; margin-bottom: 40px; display: flex; flex-direction: column; align-items: flex-start; }
    .chapter-num { font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 300; color: var(--text-muted); letter-spacing: 0.2em; margin-bottom: 10px; }
